<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>tiktokgameee — เวทีคนเต้น</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- พื้นหลังเวทีคอนเสิร์ต -->
  <div id="stage-bg"></div>
  <div id="bg-shade"></div>
  <div id="beams" aria-hidden="true">
    <div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div>
    <div class="beam b4"></div><div class="beam b5"></div>
  </div>
  <div id="sparkles" aria-hidden="true"></div>

  <!-- ป้ายเวที (แทนแถบหัวแบบ TikTok) -->
  <header id="stage-sign">
    <span class="live-dot"></span>
    <span class="sign-host" id="sign-host">tiktokgameee</span>
    <span class="sign-sep">◆</span>
    <span class="sign-viewers" id="sign-viewers">👥 0</span>
  </header>

  <!-- ป้ายสถานะการเชื่อมต่อ -->
  <div id="mode-badge" class="hidden"></div>

  <!-- ===== คอลัมน์ซ้าย: อันดับ + แชท ===== -->
  <aside id="left-col">
    <section class="panel" id="leaderboard">
      <div class="panel-title">🏆 อันดับผู้ชม</div>
      <div class="rank-list" id="rank-list"></div>
    </section>
    <section class="panel chat-panel" id="chat-panel">
      <div class="chat-list" id="chat-list"></div>
    </section>
  </aside>

  <!-- ===== คอลัมน์ขวา: Goal + ภารกิจ ===== -->
  <aside id="right-col">
    <section class="panel" id="goal-panel">
      <div class="panel-title">🎯 ตัว Goal <span class="goal-count" id="goal-count">(0/6)</span></div>
      <div class="goal-bar"><div class="goal-fill" id="goal-fill"></div></div>
      <ul class="goal-list">
        <li><span class="g-emoji">🌹</span><span class="g-name">Rose ×1</span><span class="g-num" id="goal-1">0</span></li>
        <li><span class="g-emoji">💎</span><span class="g-name">ของขวัญรวม</span><span class="g-num" id="goal-2">0</span></li>
        <li><span class="g-emoji">📣</span><span class="g-name">แชร์ LIVE</span><span class="g-num" id="goal-3">0</span></li>
      </ul>
    </section>
    <section class="panel" id="mission-panel">
      <div class="panel-title">📋 ภารกิจวันนี้</div>
      <div class="mission-row"><span>💬 คอมเมนต์</span><b id="st-comments">0</b></div>
      <div class="mission-row"><span>❤️ ไลก์รวม</span><b id="st-likes">0</b></div>
      <div class="mission-row"><span>⭐ ขึ้นเวทีแล้ว</span><b id="st-promoted">0</b></div>
    </section>
  </aside>

  <!-- ===== เวที: ตัวละครเต้น ===== -->
  <main id="stage" aria-label="เวทีตัวละคร"></main>

  <!-- โต๊ะตอบการขึ้นเวที -->
  <div id="toast-layer"></div>

  <!-- ===== แบนเนอร์เหตุการณ์ ===== -->
  <div id="event-banner"><span class="eb-icon" id="eb-icon">✨</span><span id="eb-text"></span></div>

  <!-- ===== แถวล่าง: คนรอขึ้นเวที + ช่องเข้าร่วม ===== -->
  <section id="queue-bar">
    <div class="queue-label">
      <span class="q-title">⏳ รอขึ้นเวที</span>
      <span class="q-count" id="queue-count">0</span>
    </div>
    <div class="queue-chips" id="queue-chips"></div>
    <div class="queue-join">
      <input id="join-input" type="text" placeholder="พิมพ์ชื่อแล้ว Enter = เข้าเต้น 💃" maxlength="40" autocomplete="off" />
    </div>
  </section>

  <!-- ปุ่มเปิดแผงควบคุม -->
  <button id="admin-fab" title="แผงควบคุม">⚙️</button>

  <script src="/js/app.js"></script>
</body>
</html>
