<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>tiktokgameee — ขึ้นเวที LIVE</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- พื้นหลังเวที -->
  <div id="stage-bg"></div>
  <div id="bg-shade"></div>

  <!-- แสงไฟจุดจุด -->
  <div id="sparkles" aria-hidden="true"></div>

  <!-- ===== HUD ด้านบน ===== -->
  <header id="topbar">
    <div class="host-box">
      <img class="host-avatar" id="host-avatar" alt="" />
      <div class="host-meta">
        <div class="host-name" id="host-name">nene ai</div>
        <div class="host-sub" id="host-sub">♥ 927.7K</div>
      </div>
      <button class="follow-btn" id="follow-btn">+ Follow</button>
    </div>
    <div class="topbar-right">
      <div class="viewer-pill" title="ผู้ชมในห้อง">
        <span class="dot-live"></span><span id="viewer-count">0</span>
      </div>
      <div class="close-btn" title="ปิด">✕</div>
    </div>
  </header>

  <!-- ===== คอลัมน์ซ้าย: อันดับ + แชท ===== -->
  <aside id="left-col">
    <section class="panel" id="leaderboard">
      <div class="panel-title">🏆 อันดับผู้ชม</div>
      <div class="rank-list" id="rank-list"></div>
    </section>
    <section class="panel chat-panel" id="chat-panel">
      <div class="chat-list" id="chat-list"></div>
    </section>
  </aside>

  <!-- ===== คอลัมน์ขวา: Goal + ภารกิจ ===== -->
  <aside id="right-col">
    <section class="panel" id="goal-panel">
      <div class="panel-title">🎯 ตัว Goal <span class="goal-count" id="goal-count">(0/6)</span></div>
      <div class="goal-bar"><div class="goal-fill" id="goal-fill"></div></div>
      <ul class="goal-list">
        <li><span class="g-emoji">🌹</span><span class="g-name">Rose ×1</span><span class="g-num" id="goal-1">0</span></li>
        <li><span class="g-emoji">💎</span><span class="g-name">ของขวัญรวม</span><span class="g-num" id="goal-2">0</span></li>
        <li><span class="g-emoji">📣</span><span class="g-name">แชร์ LIVE</span><span class="g-num" id="goal-3">0</span></li>
      </ul>
    </section>
    <section class="panel" id="mission-panel">
      <div class="panel-title">📋 ภารกิจวันนี้</div>
      <div class="mission-row"><span>💬 คอมเมนต์</span><b id="st-comments">0</b></div>
      <div class="mission-row"><span>❤️ ไลก์รวม</span><b id="st-likes">0</b></div>
      <div class="mission-row"><span>⭐ ขึ้นเวทีแล้ว</span><b id="st-promoted">0</b></div>
    </section>
  </aside>

  <!-- ===== เวที: ตัวละคร ===== -->
  <main id="stage" aria-label="เวทีตัวละคร"></main>

  <!-- โต๊ะตอบการขึ้นเวที -->
  <div id="toast-layer"></div>

  <!-- ===== แบนเนอร์เหตุการณ์ ===== -->
  <div id="event-banner"><span class="eb-icon" id="eb-icon">✨</span><span id="eb-text"></span></div>

  <!-- ===== แถวล่าง: คนรอขึ้นเวที ===== -->
  <section id="queue-bar">
    <div class="queue-label">
      <span class="q-title">⏳ รอขึ้นเวที</span>
      <span class="q-count" id="queue-count">0</span>
    </div>
    <div class="queue-chips" id="queue-chips"></div>
<div class="queue-hint" id="queue-hint">👋 พิมพ์คอมเมนต์แล้วกด Enter = เข้าเกมส์กับคนดู · คนใหม่อยู่ด้านล่างก่อน นาน ๆ จะขึ้นเวที</div>
  </section>

  <!-- ป้ายเตือนโหมด -->
  <div id="mode-badge" class="hidden"></div>

  <!-- ===== แถบ action สไตล์ TikTok ===== -->
  <footer id="action-bar">
    <div class="comment-box">
      <input id="comment-input" type="text" placeholder="พิมพ์..." maxlength="120" autocomplete="off" />
    </div>
    <button class="act-btn" id="emoji-btn" title="อิโมจิ">😊</button>
    <button class="act-btn" id="pk-btn" title="PK">👥</button>
    <button class="act-btn like-btn" id="like-btn" title="กดไลก์">❤️</button>
    <button class="act-btn" id="gift-btn" title="ส่งของขวัญ">🎁</button>
    <div class="share-pill" title="แชร์ LIVE"><span>📣</span><b id="share-count">5.4K</b></div>
  </footer>

  <!-- ปุ่มเปิดแผงควบคุม -->
  <button id="admin-fab" title="แผงควบคุม">⚙️</button>

  <script src="/js/app.js"></script>
</body>
</html>
